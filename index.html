<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0D11" />

    <title>H&amp;D MOTORENS | Motos, patinetas y carros eléctricos</title>
    <meta name="description" content="Motos, patinetas y carros eléctricos, taller y más de 130 repuestos con precio. Consulta y compra por WhatsApp en H&amp;D MOTORENS." />
    <!-- Dirección pública: si cambia el dominio, actualizarla aquí, en StructuredData.tsx, robots.txt y sitemap.xml -->
    <link rel="canonical" href="https://www.hydmotorens.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="H&amp;D MOTORENS" />
    <meta property="og:url" content="https://www.hydmotorens.com/" />
    <meta property="og:title" content="H&amp;D MOTORENS | Motos, patinetas y carros eléctricos" />
    <meta property="og:description" content="Motos, patinetas y carros eléctricos, taller y más de 130 repuestos con precio. Consulta y compra por WhatsApp en H&amp;D MOTORENS." />
    <!-- JPG con URL completa: WhatsApp y Facebook no muestran SVG ni rutas relativas -->
    <meta property="og:image" content="https://www.hydmotorens.com/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Carro plateado de cinco puertas visto de tres cuartos" />
    <meta property="og:locale" content="es_CO" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Póster del vídeo de la portada: se pide antes que el JS para que aparezca
      rápido. En /admin no: este mismo HTML sirve el panel, que no lo muestra, y
      el navegador avisaba en la consola de una precarga sin usar.
    -->
    <script>
      if (!/^\/admin(\/|$)/.test(location.pathname)) {
        var poster = document.createElement('link')
        poster.rel = 'preload'
        poster.as = 'image'
        poster.type = 'image/jpeg'
        poster.href = '/video/hero-poster.jpg'
        poster.setAttribute('fetchpriority', 'high')
        document.head.appendChild(poster)
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
