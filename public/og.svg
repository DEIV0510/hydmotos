    <path d="M604 260 C 588 236, 548 224, 502 226 C 458 228, 424 242, 408 264 L 406 292 C 440 306, 494 308, 536 300 C 578 292, 604 278, 604 260 Z" fill="url(#fl)"/>
    <path d="M408 264 L 350 250 C 322 244, 292 234, 268 224 C 256 219, 244 226, 244 238 C 244 250, 256 258, 272 264 C 310 278, 356 286, 406 292 Z" fill="url(#fl)"/>
