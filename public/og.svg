<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04060A"/><stop offset=".55" stop-color="#0A1020"/><stop offset="1" stop-color="#04060A"/>
    </linearGradient>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DF0FF"/><stop offset=".5" stop-color="#2E7BFF"/><stop offset="1" stop-color="#1140C8"/>
    </linearGradient>
    <linearGradient id="fl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E7BFF" stop-opacity=".34"/><stop offset="1" stop-color="#0B2A7A" stop-opacity=".05"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#1E5BFF" stop-opacity=".5"/><stop offset="1" stop-color="#1E5BFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#78A0DC" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="820" cy="330" rx="380" ry="300" fill="url(#halo)"/>

  <!-- Moto -->
