  <!-- Texto -->
  <g transform="translate(80 208)">
    <text font-family="Impact, 'Arial Narrow', sans-serif" font-size="26" letter-spacing="6" fill="#22E0FF">MOVILIDAD ELÉCTRICA</text>
    <text y="88" font-family="Impact, 'Arial Narrow', sans-serif" font-size="88" fill="#E6ECF4">LA CIUDAD,</text>
    <text y="176" font-family="Impact, 'Arial Narrow', sans-serif" font-size="88" fill="#2E7BFF">SIN GASOLINA<tspan fill="#FF2233">.</tspan></text>
    <text y="238" font-family="Arial, sans-serif" font-size="25" fill="#A5B2C3">19 modelos · Hasta 90 km de autonomía · Desde $2.400.000</text>
  </g>

  <!-- Marca -->
  <g transform="translate(80 74)">
    <path d="M22 2 L42 13 V35 L22 46 L2 35 V13 Z" fill="none" stroke="url(#ln)" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M11 15 V33 M11 24 H19 M19 15 V33" stroke="#E6ECF4" stroke-width="3.4" stroke-linecap="round" fill="none"/>
    <path d="M27 15 H30 a7.4 9 0 0 1 0 18 H27 Z" fill="none" stroke="#E6ECF4" stroke-width="3.4" stroke-linejoin="round"/>
    <text x="60" y="34" font-family="Impact, 'Arial Narrow', sans-serif" font-size="30" letter-spacing="1.5" fill="#E6ECF4">H<tspan fill="#FF2233">&amp;</tspan>D MOTORENS</text>
