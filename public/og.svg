    <circle cx="200" cy="372" r="104"/><circle cx="700" cy="372" r="104"/>
    <g stroke-width="4" opacity=".9">
      <circle cx="200" cy="372" r="66"/><circle cx="700" cy="372" r="66"/>
      <path d="M200 306 L200 438 M143 339 L257 405 M143 405 L257 339"/>
      <path d="M700 306 L700 438 M643 339 L757 405 M643 405 L757 339"/>
